name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: the older run's result is
# about code nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  test:
    name: tests
    runs-on: ubuntu-latest

    # Postgres is provided so the audit-trail integration tests actually run.
    # Without it they skip, and a suite that skips its integration coverage is
    # green for the wrong reason.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aftermerge
          POSTGRES_PASSWORD: aftermerge
          POSTGRES_DB: shopdemo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U aftermerge -d shopdemo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: aftermerge
      POSTGRES_PASSWORD: aftermerge

    steps:
      - uses: actions/checkout@v4
        with:
          # Several tests resolve the scenario commits and diff them, so the
          # default shallow clone is not enough.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch scenario branches
        # Scenario fixtures pin a bad_sha living on a regression branch, so a
        # clone without it fails test_scenario_commits_are_reachable.
        #
        # Fetched into refs/heads, not refs/remotes, on purpose: `infer_base`
        # runs `git branch --contains`, which sees local branches only. With
        # remote-tracking refs alone it finds no candidate base and the pull
        # request test fails for a reason that has nothing to do with the code.
        run: git fetch origin '+refs/heads/regression/*:refs/heads/regression/*'

      - name: Tests
        # The slow marker covers sandbox and replay tests. Those drive Docker
        # Compose projects and talk to a ClickHouse container by name, which is
        # a local-developer topology rather than something a runner provides, so
        # they stay out of CI and are documented as such.
        run: uv run pytest -q
