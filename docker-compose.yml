# AfterMerge local stack.
#
# Phase A brings up storage and the telemetry pipe only -- nothing emits spans yet.
# The demo application (fixtures/shopdemo) joins this file in Phase B.

name: aftermerge

services:
  clickhouse:
    # Pinned to 25.3 LTS: the 25.8 arm64 build ships a 0-byte /entrypoint.sh
    # and dies with "exec format error". Verify any bump actually starts.
    image: clickhouse/clickhouse-server:25.3
    container_name: aftermerge-clickhouse
    ports:
      - "8123:8123"   # HTTP  -- clickhouse-connect, curl
      - "9000:9000"   # native -- the collector's exporter
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    container_name: aftermerge-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aftermerge
      POSTGRES_PASSWORD: aftermerge
      POSTGRES_DB: shopdemo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only when the volume is empty. `make reset` to re-seed.
      - ./fixtures/shopdemo/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 is load-bearing. During initdb Postgres runs a temporary
      # server on the unix socket only, so a socket-based pg_isready reports
      # healthy while the seed is still loading -- the app then starts against an
      # empty database and every request 500s. Small seeds finish fast enough to
      # hide this; a 400k-row seed does not.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U aftermerge -d shopdemo"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    container_name: aftermerge-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "13133:13133"  # health_check extension
    volumes:
      - ./infra/otel-collector.yaml:/etc/otel/config.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    container_name: aftermerge-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two listeners on purpose: the collector reaches the broker by service
      # name inside the compose network, while the consumer runs on the host and
      # needs an address that resolves there. A single listener would work for
      # one of them and silently fail for the other.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # ---- system under test (fixtures/shopdemo) -------------------------------

  orders:
    build: ./fixtures/shopdemo
    image: shopdemo:${GIT_SHA:-dev}
    container_name: aftermerge-orders
    command: ["uvicorn", "orders.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      GIT_SHA: ${GIT_SHA:-dev}
      DATABASE_URL: postgresql://aftermerge:aftermerge@postgres:5432/shopdemo
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  gateway:
    build: ./fixtures/shopdemo
    image: shopdemo:${GIT_SHA:-dev}
    container_name: aftermerge-gateway
    command: ["uvicorn", "gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      GIT_SHA: ${GIT_SHA:-dev}
      ORDERS_URL: http://orders:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8000:8000"
    depends_on:
      - orders

  # Run on demand: `docker compose run --rm loadgen`
  loadgen:
    image: grafana/k6:latest
    container_name: aftermerge-loadgen
    profiles: ["load"]
    volumes:
      - ./fixtures/shopdemo/loadgen:/scripts:ro
    environment:
      TARGET: http://gateway:8000
      RPS: ${RPS:-20}
      DURATION: ${DURATION:-60s}
    command: ["run", "/scripts/browse.js"]
    depends_on:
      - gateway

volumes:
  clickhouse-data:
  postgres-data:
