# AfterMerge telemetry pipeline: OTLP in, ClickHouse out.
#
# Requires the *contrib* collector distribution. The core image does not bundle
# the clickhouse exporter and will fail at startup with an unknown-type error.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  # Spans fan out to both sinks. ClickHouse remains the durable store that every
  # batch query reads; Kafka carries the same spans to a consumer that can react
  # while a rollout is still happening, rather than after it.
  kafka:
    brokers: [kafka:9092]
    topic: otel-spans
    # JSON rather than the default protobuf so the consumer needs no generated
    # stubs, and so a human can read a message off the topic while debugging.
    encoding: otlp_json
    producer:
      compression: none

  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=lz4
    database: otel
    username: default
    password: ""
    create_schema: true
    traces_table_name: otel_traces
    logs_table_name: otel_logs
    metrics_table_name: otel_metrics
    ttl: 72h
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # Mirrors span counts to the collector log. Cheap signal for "is anything arriving".
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse, kafka, debug]
  telemetry:
    logs:
      level: info
