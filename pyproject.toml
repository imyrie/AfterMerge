[project]
name = "aftermerge"
version = "0.1.0"
description = "Closed-loop production regression pipeline: detect, investigate, reproduce, test, patch, verify."
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=0.9",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    "typer>=0.15",
    "rich>=13.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "httpx>=0.28",
]

[project.scripts]
aftermerge = "aftermerge.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "scipy-stubs>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aftermerge"]

[tool.ruff]
line-length = 100
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer's API requires these in argument defaults; B008 is a false positive here.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/aftermerge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Sandbox tests build and run containers; excluded by default so the fast suite
# stays usable for iteration. `make test-all` runs everything.
addopts = "-m 'not slow'"
markers = ["slow: builds and runs docker sandboxes (tens of seconds)"]
