[project]
name = "aftermerge"
version = "0.1.0"
description = "Closed-loop production regression pipeline: detect, investigate, reproduce, test, patch, verify."
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=0.9",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aftermerge"]

[tool.ruff]
line-length = 100
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/aftermerge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
